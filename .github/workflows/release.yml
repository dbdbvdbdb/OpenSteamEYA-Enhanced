name: Build and publish Release

on:
  push:
    tags: ['v*']
    # This version's public release was explicitly requested by the maintainer.
    # Other tags and manual runs retain the draft-only behavior below.
    branches: [main]
    paths: ['docs/releases/v0.3.0.md']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v (example: 0.3.0)'
        required: true
        default: '0.3.0'
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce public rights review
        shell: pwsh
        run: ./scripts/assert-release-ready.ps1
      - name: Audit all refs and public source for secrets
        shell: pwsh
        run: ./scripts/check-secrets.ps1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Verify exact SDK for locked Native AOT restore
        shell: pwsh
        run: ./scripts/assert-dotnet-sdk.ps1
      - name: Validate version
        id: meta
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $publishRequested = $env:EVENT_NAME -eq 'push' -and $env:REF -eq 'refs/heads/main'
          $label = if ($publishRequested) { '0.3.0' } elseif ($env:EVENT_NAME -eq 'push') { $env:REF_NAME -replace '^v', '' } else { $env:INPUT_VERSION.Trim() }
          if ($label -notmatch '^(\d+\.\d+\.\d+)(?:-beta(?:\.\d+)?)?$') { throw 'Expected X.Y.Z or X.Y.Z-beta[.N].' }
          $numeric = $Matches[1]
          "version=$numeric" >> $env:GITHUB_OUTPUT
          "label=$label" >> $env:GITHUB_OUTPUT
          "tag=v$label" >> $env:GITHUB_OUTPUT
          "publish=$($publishRequested.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if (-not (Test-Path "./docs/releases/v$label.md")) { throw 'Reviewed release notes missing.' }
      - name: Detect existing release without modifying it
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          $tags = gh api "repos/$env:GH_REPO/releases?per_page=100" --paginate --jq '.[].tag_name'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect releases; refusing to assume the tag is unpublished.' }
          $exists = @($tags) -ccontains $env:RELEASE_TAG
          "exists=$($exists.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if ($exists) { Write-Output 'Release already exists. Build and tests will run; existing assets, tag and release state will be preserved.' }
      - name: Ensure C++ and Windows SDK
        shell: pwsh
        run: ./scripts/ensure-native-toolchain.ps1 -InstallMissing
      - name: Ensure 7-Zip
        shell: pwsh
        run: |
          if (-not (Get-Command 7z -ErrorAction SilentlyContinue) -and -not (Test-Path "$env:ProgramFiles/7-Zip/7z.exe")) {
            choco install 7zip -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw '7-Zip installation failed.' }
          }
      - name: Locked restore
        shell: pwsh
        run: |
          dotnet restore ./SteamEyaWinUI/SteamEyaWinUI.csproj -r win-x64 -p:Platform=x64 -p:PublishAot=true --locked-mode
          if ($LASTEXITCODE -ne 0) { throw 'Locked restore failed.' }
      - name: Executable data checks
        shell: pwsh
        run: ./scripts/check-data.ps1
      - name: Real WinUI checks with synthetic data
        shell: pwsh
        run: ./scripts/check-manager-ui.ps1 -NativeAot
      - name: Build verified Native AOT ZIP and 7z
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          RELEASE_LABEL: ${{ steps.meta.outputs.label }}
        run: |
          ./scripts/publish-enhanced.ps1 -NativeAot -Version $env:RELEASE_VERSION -ReleaseLabel $env:RELEASE_LABEL
          if (-not (Test-Path "./artifacts/OpenSteamEYA-Enhanced-$env:RELEASE_LABEL-win-x64-aot.7z")) { throw '7z package missing.' }
      - name: Upload exact release files for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ steps.meta.outputs.label }}-windows-x64
          path: |
            artifacts/OpenSteamEYA-Enhanced-${{ steps.meta.outputs.label }}-win-x64-aot.zip
            artifacts/OpenSteamEYA-Enhanced-${{ steps.meta.outputs.label }}-win-x64-aot.7z
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Create release (draft unless this publication was requested)
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_LABEL: ${{ steps.meta.outputs.label }}
          RELEASE_COMMIT: ${{ github.sha }}
          PUBLISH_REQUESTED: ${{ steps.meta.outputs.publish }}
        run: |
          $existing = gh release view $env:RELEASE_TAG --json tagName --jq '.tagName' 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists. Refusing to overwrite assets or release state.' }
          $repo = gh repo view --json nameWithOwner --jq '.nameWithOwner'
          if ($LASTEXITCODE -ne 0 -or $repo -ne $env:GH_REPO) { throw 'Repository authentication failed.' }
          $zip = "./artifacts/OpenSteamEYA-Enhanced-$env:RELEASE_LABEL-win-x64-aot.zip"
          $seven = "./artifacts/OpenSteamEYA-Enhanced-$env:RELEASE_LABEL-win-x64-aot.7z"
          $releaseArgs = @('release','create',$env:RELEASE_TAG,$zip,$seven,'./artifacts/SHA256SUMS.txt',
            '--target',$env:RELEASE_COMMIT,'--title',"OpenSteamEYA Enhanced $env:RELEASE_TAG",
            '--notes-file',"./docs/releases/$env:RELEASE_TAG.md")
          if ($env:RELEASE_LABEL.Contains('-')) { $releaseArgs += @('--prerelease','--latest=false') } else { $releaseArgs += '--latest=true' }
          if ($env:PUBLISH_REQUESTED -eq 'true') {
            if ($env:RELEASE_TAG -ne 'v0.3.0') { throw 'Publication authorization is limited to v0.3.0.' }
          } else { $releaseArgs += '--draft' }
          & gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
